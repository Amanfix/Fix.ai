<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            display: flex;
            margin-bottom: 10px;
        }
        
        .user-message {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            line-height: 1.5;
        }
        
        .user-message .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .bot-message .message-content {
            background: #f1f3f5;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        
        .sources {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #666;
        }
        
        .source-link {
            color: #667eea;
            text-decoration: none;
            margin-right: 10px;
        }
        
        .source-link:hover {
            text-decoration: underline;
        }
        
        .chat-input-container {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            display: flex;
            align-items: center;
        }
        
        #message-input {
            flex: 1;
            border: 1px solid #ced4da;
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }
        
        #message-input:focus {
            border-color: #667eea;
        }
        
        #send-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            margin-left: 15px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        
        #send-button:hover {
            transform: scale(1.05);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 15px;
            color: #666;
            font-style: italic;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 15px;
            color: #666;
        }
        
        .typing-indicator span {
            height: 10px;
            width: 10px;
            background: #667eea;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }
        
        @media (max-width: 600px) {
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            AI Chat Assistant
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                <div class="message-content">
                    Hello! I'm your AI assistant. Ask me anything and I'll search the web for the latest information.
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <div class="loading" id="loading">Searching and generating response...</div>
        
        <div class="chat-input-container">
            <input type="text" id="message-input" placeholder="Ask anything..." autocomplete="off">
            <button id="send-button">➤</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatMessages = document.getElementById('chat-messages');
            const messageInput = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const loadingIndicator = document.getElementById('loading');
            const typingIndicator = document.getElementById('typing-indicator');
            
            // Replace with your actual backend URL when deployed
            const API_URL = 'https://your-backend-url.vercel.app/chat';
            
            // Hide loading indicators initially
            loadingIndicator.style.display = 'none';
            typingIndicator.style.display = 'none';
            
            // Function to add a message to the chat
            function addMessage(content, isUser = false, sources = []) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
                
                const messageContent = document.createElement('div');
                messageContent.className = 'message-content';
                messageContent.textContent = content;
                
                messageDiv.appendChild(messageContent);
                
                // Add sources if available
                if (sources.length > 0) {
                    const sourcesDiv = document.createElement('div');
                    sourcesDiv.className = 'sources';
                    
                    const sourcesLabel = document.createElement('span');
                    sourcesLabel.textContent = 'Sources: ';
                    sourcesDiv.appendChild(sourcesLabel);
                    
                    sources.forEach((source, index) => {
                        const sourceLink = document.createElement('a');
                        sourceLink.href = source.url;
                        sourceLink.textContent = `[${index + 1}] ${source.title}`;
                        sourceLink.className = 'source-link';
                        sourceLink.target = '_blank';
                        sourcesDiv.appendChild(sourceLink);
                        
                        if (index < sources.length - 1) {
                            sourcesDiv.appendChild(document.createTextNode(', '));
                        }
                    });
                    
                    messageDiv.appendChild(sourcesDiv);
                }
                
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            // Function to show loading state
            function showLoading() {
                loadingIndicator.style.display = 'block';
                typingIndicator.style.display = 'flex';
            }
            
            // Function to hide loading state
            function hideLoading() {
                loadingIndicator.style.display = 'none';
                typingIndicator.style.display = 'none';
            }
            
            // Function to send a message
            async function sendMessage() {
                const message = messageInput.value.trim();
                if (!message) return;
                
                // Add user message to chat
                addMessage(message, true);
                messageInput.value = '';
                
                // Show loading indicators
                showLoading();
                
                try {
                    // Send request to backend
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ query: message })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Server responded with ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    // Hide loading indicators
                    hideLoading();
                    
                    // Add bot response to chat
                    addMessage(data.response, false, data.sources);
                    
                } catch (error) {
                    console.error('Error:', error);
                    hideLoading();
                    addMessage(`Sorry, I encountered an error: ${error.message}`, false);
                }
            }
            
            // Event listeners
            sendButton.addEventListener('click', sendMessage);
            
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Focus on input field when page loads
            messageInput.focus();
        });
    </script>
</body>
</html>
